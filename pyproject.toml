
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "college-ai-assistant"
version = "0.1.0"
description = "Personal AI learning assistant for college coursework"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
