[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "college-ai-assistant"
version = "0.1.0"
description = "Personal AI learning assistant for college coursework"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.50.0",
    "python-dotenv>=1.0.1",
    "openai>=1.60.0",
    "PyMuPDF>=1.25.0",
    "python-docx>=1.1.2",
    "python-pptx>=0.6.23",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
